design_task:
  name: Engineering design
  description: >
    Analyze this brief: {project_brief}
    CrewAI workflow mode: {workflow_mode}

    As Engineering Lead, create design.md before any implementation starts. Write
    this design task yourself; do not delegate it. This is the execution plan the
    other agents receive and must follow. Write it as a
    readable Markdown blueprint using these sections:

    # Project Overview: goal, users, scope, assumptions, and constraints.
    # User Workflow: the main steps the user performs.
    # Responsibilities: separate subsections for backend_engineer,
    frontend_engineer, and test_engineer. For each, list its owned file(s), concrete
    responsibilities, dependencies, acceptance checks, and handoff.
    # Backend Design: select storage and data model from the brief, define business
    rules and exact public function signatures/data contracts for backend.py.
    # Frontend Design: specify the Gradio layout, interactions, and exact backend
    functions the UI calls.
    # Test Plan: map acceptance criteria and edge cases to test_backend.py.
    # Acceptance Criteria and Handoff Order: make each criterion verifiable and
    state that backend.py is completed before frontend and tests consume it.

    Near the top of design.md, include `Workflow mode: {workflow_mode}` and briefly
    describe how that mode coordinates or orders the agents.

    Assign backend_engineer to backend.py, frontend_engineer to app.py, and
    test_engineer to test_backend.py. Tailor responsibilities and design decisions
    to the project brief; do not assume a storage model or features the brief does
    not require. Keep every deliverable in the shared output directory. The frontend
    uses Gradio. Do not write implementation code in design.md. The specialists must
    use this document as their source of truth rather than making a new design.
  expected_output: >
    A complete design.md Markdown blueprint with Project Overview, User Workflow,
    Responsibilities, Backend Design, Frontend Design, Test Plan, Acceptance
    Criteria, and Handoff Order sections. It assigns one file per specialist and
    defines the interfaces they must implement.

code_task:
  name: Backend implementation
  description: >
    Implement the backend business logic for this brief: {project_brief}

    Follow the Engineering Design (design.md) in your task context as the source of
    truth. Implement only the backend_engineer assignment, match the agreed public
    signatures and data contracts, and satisfy the listed acceptance criteria. Write
    one complete backend.py module, independent of Gradio and external services.
    Deliver the complete file; return only valid Python source, without Markdown
    fences. If the design has a gap, make the smallest consistent assumption.
  expected_output: Complete Python source code for backend.py, with testable functions and no UI code.

frontend_task:
  name: Frontend implementation
  description: >
    Build the frontend for this brief: {project_brief}

    Follow the Engineering Design (design.md) as the source of truth and use the
    Backend Implementation from your task context. Implement only the
    frontend_engineer assignment; import backend.py and use its agreed interfaces.
    Satisfy the listed acceptance criteria, then deliver one complete Gradio app in
    app.py with empty/error states and a normal Python launch entry point. Return only
    valid Python source, without Markdown fences. If the design has a gap, make the
    smallest consistent assumption.
  expected_output: Complete Gradio Python source code for app.py that uses backend.py.

test_task:
  name: Backend unit tests
  description: >
    Write unit tests for the backend module implementing this brief: {project_brief}

    Follow the Engineering Design (design.md) as the source of truth and inspect the
    Backend Implementation in your task context. Implement only the test_engineer
    assignment. Create and deliver test_backend.py using standard-library unittest;
    cover every applicable acceptance criterion and important edge case. Match the
    backend's actual public interfaces, do not test the Gradio frontend, and do not
    call external services. Return only valid Python source, without Markdown fences.
  expected_output: A runnable unittest module in Python source form for test_backend.py.
